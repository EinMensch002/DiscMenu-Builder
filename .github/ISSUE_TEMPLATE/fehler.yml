name: Fehler melden
description: Etwas funktioniert nicht wie erwartet
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Danke für die Meldung! Die Labels werden automatisch aus Deinen Angaben gesetzt.
  - type: dropdown
    id: bereich
    attributes:
      label: Bereich
      description: Welcher Teil des Projekts ist betroffen? (Mehrfachauswahl möglich)
      multiple: true
      options:
        - Konfigurator
        - DiscSleeve
        - Builder
        - Player
        - Proxy
        - Tests und Veröffentlichung
    validations:
      required: true
  - type: textarea
    id: was
    attributes:
      label: Was ist passiert?
      description: Was hast Du gemacht, was ist passiert, was hättest Du erwartet?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. DiscSleeve öffnen
        2. …
  - type: input
    id: umgebung
    attributes:
      label: Browser oder System
      placeholder: z. B. Chrome 130 auf Windows 11, Samsung Internet auf Tablet
  - type: checkboxes
    id: stand
    attributes:
      label: Stand
      options:
        - label: Muss auf einem echten Gerät geprüft werden (Drucker, Disc, Windows, Wine)
