name: Idee oder Wunsch
description: Eine neue Funktion oder Verbesserung vorschlagen
labels: ["enhancement", "idee"]
body:
  - type: markdown
    attributes:
      value: |
        Danke für die Idee! Die Labels werden automatisch aus Deinen Angaben gesetzt.
  - type: dropdown
    id: bereich
    attributes:
      label: Bereich
      description: Welcher Teil des Projekts ist betroffen? (Mehrfachauswahl möglich)
      multiple: true
      options:
        - Konfigurator
        - DiscSleeve
        - Builder
        - Player
        - Proxy
        - Tests und Veröffentlichung
    validations:
      required: true
  - type: textarea
    id: wunsch
    attributes:
      label: Was wünschst Du Dir?
      description: Was soll möglich sein und wofür brauchst Du es?
    validations:
      required: true
  - type: textarea
    id: ideen
    attributes:
      label: Wie könnte es aussehen?
      description: Skizze, Screenshot oder Beispiel (optional)
  - type: checkboxes
    id: stand
    attributes:
      label: Stand
      options:
        - label: Muss auf einem echten Gerät geprüft werden (Drucker, Disc, Windows, Wine)
