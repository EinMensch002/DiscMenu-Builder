# Setzt Labels aus den Angaben des Issue-Formulars (.github/ISSUE_TEMPLATE/issue.yml).
# So bekommen auch Issues von Leuten ohne Rechte am Repository die gewünschten Labels.
# Verwaltet werden nur die Labels aus FORM (Freigabeliste). Alle anderen (z. B. wontfix, in arbeit)
# setzt nur der Besitzer, sie werden hier nie hinzugefügt oder entfernt.
# Beim Bearbeiten des Issues werden abgewählte Labels der Freigabeliste entfernt, neue hinzugefügt.
name: Issue-Labels

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const FORM = {
              'Art': {
                'Fehler': ['bug'],
                'Idee oder Wunsch': ['enhancement', 'idee'],
                'Frage': ['question'],
                'Dokumentation': ['documentation'],
                'Barrierefreiheit': ['accessibility'],
              },
              'Bereich': {
                'Konfigurator': ['konfigurator'],
                'DiscSleeve': ['discsleeve'],
                'Builder': ['builder'],
                'Player': ['player'],
                'Proxy': ['proxy'],
                'Tests und Veröffentlichung': ['ci'],
              },
            };
            const DEVICE = 'manuell testen';
            const MANAGED = new Set([DEVICE, ...Object.values(FORM).flatMap((m) => Object.values(m).flat())]);

            const issue = context.payload.issue;
            const body = (issue.body || '').replace(/\r/g, '');
            // Formular-Antworten stehen als "### Überschrift", Leerzeile, Antwort im Text
            const parts = body.split(/^### +/m).slice(1);
            const section = (title) => {
              const p = parts.find((s) => s.split(/\n/)[0].trim() === title);
              return p === undefined ? null : p.replace(/^.*\n/, '').trim();
            };
            if (Object.keys(FORM).every((t) => section(t) === null)) { core.info('Kein Formular, nichts zu tun.'); return; }

            const want = new Set();
            for (const [title, map] of Object.entries(FORM)) {
              for (const v of (section(title) || '').split(',').map((s) => s.trim())) for (const l of map[v] || []) want.add(l);
            }
            if (/^- \[x\] Muss auf einem echten Gerät geprüft werden/mi.test(section('Stand') || '')) want.add(DEVICE);

            const have = new Set((issue.labels || []).map((l) => (typeof l === 'string' ? l : l.name)));
            const add = [...want].filter((l) => !have.has(l));
            const remove = [...have].filter((l) => MANAGED.has(l) && !want.has(l));
            const nr = { ...context.repo, issue_number: issue.number };
            if (add.length) await github.rest.issues.addLabels({ ...nr, labels: add });
            for (const name of remove) await github.rest.issues.removeLabel({ ...nr, name });
            core.info('Hinzugefügt: ' + (add.join(', ') || '-') + ' | Entfernt: ' + (remove.join(', ') || '-'));
