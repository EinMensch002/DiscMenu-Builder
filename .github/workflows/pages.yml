name: Konfigurator auf GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'configurator/**'
      - 'disc-sleeve/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nicht abbrechen: Ein laufendes Veröffentlichen wird sonst von einem neuen Lauf (z. B. Push auf main und Vorschau-Aufräumen gleichzeitig)
# mitten im Hochladen abgebrochen, und GitHub zeigt es als fehlgeschlagene Bereitstellung (Deployment) an. Wartende Läufe werden zusammengefasst.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Konfigurator liegt im Wurzelverzeichnis der Seite, DiscSleeve (Hüllen) unter /disc-sleeve/, die alte Adresse /cover/ leitet dorthin weiter
      - name: Seite zusammenstellen
        run: |
          mkdir site
          cp -r configurator/. site/
          cp -r disc-sleeve site/disc-sleeve
          # Versionsnummer in die Adressen der Dateien schreiben: Browser laden nach jeder Veröffentlichung die neuen Dateien
          # (sonst mischen sie bis zu 10 Minuten lang alte und neue Teile der Seite)
          sed -i "s/__VERSION__/${GITHUB_SHA::7}/g" site/disc-sleeve/index.html
          # alte Adresse /cover/ weiterleiten (bestehende Lesezeichen und Links)
          mkdir site/cover
          printf '%s\n' '<!doctype html><html lang="de"><meta charset="utf-8"><title>DiscSleeve</title><meta http-equiv="refresh" content="0; url=../disc-sleeve/"><link rel="canonical" href="../disc-sleeve/"><p>DiscSleeve ist umgezogen: <a href="../disc-sleeve/">zur neuen Adresse</a>.</p></html>' > site/cover/index.html
      # Vorschauen offener Pull Requests (liegen im Zweig gh-pages unter pr/<Nummer>/, siehe preview.yml) unter /pr/ mitveröffentlichen
      - name: Vorschauen einfügen
        run: |
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            git worktree add --detach ../previews FETCH_HEAD
            if [ -d ../previews/pr ]; then mkdir -p site/pr && cp -r ../previews/pr/. site/pr/; fi
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
