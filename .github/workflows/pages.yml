name: Konfigurator auf GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'configurator/**'
      - 'cover-tool/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Konfigurator liegt im Wurzelverzeichnis der Seite, das Cover-Tool unter /cover/
      - name: Seite zusammenstellen
        run: |
          mkdir site
          cp -r configurator/. site/
          cp -r cover-tool site/cover
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
