name: Tests

# Vorerst werden nur die beiden Web-Tools (Konfigurator und Cover-Tool) automatisch geprüft.
# Builder und Player (Go, Windows-Build, Wine-Rauchtest) sind noch nicht in Arbeit und laufen deshalb nicht mit.
# Der Code liegt weiter im Repo (src/, scripts/build.sh) und lässt sich von Hand prüfen: go test ./... und scripts/build.sh.
# Zum Wiederaktivieren die Jobs go, windows und wine aus dem Verlauf dieser Datei zurückholen (Commit vor dieser Änderung).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web-Tools (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
