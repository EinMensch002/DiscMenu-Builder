<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiscMenu-Konfigurator</title>
<style>
:root{--bg:#14161a;--panel:#1d2026;--panel2:#252932;--line:#333845;--txt:#e8eaf0;--mut:#9aa1b2;--acc:#4f8cff;--err:#ff6b6b;--warn:#f0b429;--ok:#3ddc97}
@media (prefers-color-scheme:light){:root{--bg:#f2f4f8;--panel:#fff;--panel2:#eef1f6;--line:#d5dae4;--txt:#1b1f29;--mut:#5b6476;--acc:#2f6fed;--err:#d93a3a;--warn:#b57a00;--ok:#14935f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0}
header .btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button.sm{padding:3px 9px;font-size:13px}
button.danger:hover{border-color:var(--err);color:var(--err)}
main{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:14px;padding:14px;max-width:1500px;margin:0 auto}
@media (max-width:1100px){main{grid-template-columns:200px minmax(0,1fr)}#side{grid-column:1/-1}}
@media (max-width:700px){main{grid-template-columns:1fr}#nav{flex-direction:row;overflow-x:auto}.nv{white-space:nowrap}}
#nav{display:flex;flex-direction:column;gap:6px;align-self:start}
.nv{text-align:left;width:100%}
.nv.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,var(--panel2))}
.nv.add{border-style:dashed;color:var(--mut)}
#editor,#side .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
#side{display:flex;flex-direction:column;gap:14px;align-self:start}
h2{margin:0 0 4px;font-size:18px}
h3{margin:18px 0 4px;font-size:15px}
.hint,small{color:var(--mut);font-size:13px}
.f{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.lab{font-size:13px;color:var(--mut)}
input[type=text],input[type=number],input:not([type]),select,textarea{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid color-mix(in srgb,var(--acc) 60%,transparent);border-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drop{display:flex;align-items:center;gap:10px;min-height:64px;padding:8px;border:2px dashed var(--line);border-radius:10px;cursor:pointer;background:var(--bg)}
.drop.over{border-color:var(--acc)}
.drop img{max-height:56px;max-width:90px;border-radius:6px;object-fit:contain}
.drop audio{height:32px;max-width:220px}
.meta{color:var(--mut);font-size:12px}
.card{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--panel2)}
.card summary{cursor:pointer;padding:9px 12px;display:flex;gap:8px;align-items:center}
.card .body{padding:0 12px 12px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:0 8px;color:var(--mut)}
.issue{margin:4px 0;font-size:13px}
.issue.error{color:var(--err)}.issue.warn{color:var(--warn)}.ok{color:var(--ok)}
pre{margin:8px 0 0;max-height:360px;overflow:auto;font:12px/1.4 ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;white-space:pre-wrap;word-break:break-word}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--acc);border-radius:10px;padding:9px 14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;white-space:pre-line}
#toast.on{opacity:1}
dialog{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(780px,94vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.dh h2{margin:0}
.list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.list button{text-align:left}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:10px 0}
.gal button{padding:4px;display:flex;flex-direction:column;gap:4px;align-items:center}
.gal img{width:100%;height:150px;object-fit:contain;background:var(--bg);border-radius:6px}
.gal button.sel{border-color:var(--ok);outline:2px solid var(--ok)}
.gal small{font-size:11px}
.sgbtn{align-self:flex-start}
a{color:var(--acc)}
footer{text-align:center;color:var(--mut);font-size:12px;padding:6px 14px 24px}
</style>
</head>
<body>
<header>
  <div><h1 style="display:inline">DiscMenu-Konfigurator</h1> <span id="savedAt" class="hint"></span></div>
  <div class="btns">
    <button id="bProj" type="button">Projekte</button>
    <button id="bSave" type="button">Speichern</button>
    <button id="bSg" type="button">SteamGridDB</button>
    <button id="bImp" type="button">Importieren</button>
    <button id="bExp" type="button" class="pri">Als ZIP exportieren</button>
  </div>
</header>
<main>
  <nav id="nav" aria-label="Spiele"></nav>
  <section id="editor"></section>
  <aside id="side"></aside>
</main>
<footer>Läuft komplett in deinem Browser. Es wird nichts hochgeladen. Der Entwurf wird lokal im Browser zwischengespeichert.<br>
<a href="https://github.com/EinMensch002/DiscMenu-Builder/blob/main/docs/configurator.md" target="_blank" rel="noopener noreferrer">Anleitung</a> ·
<a href="https://github.com/EinMensch002/DiscMenu-Builder/blob/main/docs/steamgriddb.md" target="_blank" rel="noopener noreferrer">SteamGridDB, Beschreibungen und Proxy</a> ·
<a href="https://github.com/EinMensch002/DiscMenu-Builder" target="_blank" rel="noopener noreferrer">Quellcode</a> ·
<a href="https://www.steamgriddb.com/" target="_blank" rel="noopener noreferrer">SteamGridDB</a></footer>
<input id="impFile" type="file" accept=".zip,.json" hidden>
<dialog id="dlg"><div class="dh"><h2 id="dlgTitle"></h2><button type="button" class="sm" id="dlgX">Schließen</button></div><div id="dlgBody"></div></dialog>
<div id="toast" role="status"></div>
<script>
/* === KERN (ohne DOM, wird auch in Tests verwendet) === */
const CORE = (() => {
  const UML = {'ä':'ae','ö':'oe','ü':'ue','Ä':'ae','Ö':'oe','Ü':'ue','ß':'ss'};
  const SECTIONS = ['dlcs','patches','extras'];

  function slug(s){
    return String(s == null ? '' : s).replace(/[äöüÄÖÜß]/g, c => UML[c]).normalize('NFKD')
      .replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60);
  }
  function parseArgs(str){ return String(str || '').match(/(?:[^\s"]+|"[^"]*")+/g) || []; }
  function fromArgs(list){ return Array.isArray(list) ? list.join(' ') : ''; }
  function isUrl(p){ return /^https?:\/\//i.test(p); }
  function relPathIssue(p){
    if (/^[a-zA-Z]:/.test(p) || /^[\\/]/.test(p)) return 'muss relativ zur Disc sein (kein Laufwerk, kein führender Schrägstrich)';
    if (p.split(/[\\/]/).includes('..')) return 'darf kein ".." enthalten';
    return null;
  }

  function newItem(){ return {name:'',description:'',cover:null,group:'',kind:'installer',path:'',args:'',_open:true}; }
  function newGame(){ return {name:'',cover:null,description:'',installer:'',args:'',estimatedSizeMB:'',dlcs:[],patches:[],extras:[]}; }
  function newState(){ return {title:'',output:'',background:null,sounds:{click:null,hover:null},games:[newGame()]}; }

  /* --- CRC32 und ZIP (Speichern ohne Kompression, Lesen mit Deflate) --- */
  let T = null;
  function crc32(u8){
    if (!T){ T = new Uint32Array(256); for (let n=0;n<256;n++){ let c=n; for (let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; T[n]=c>>>0; } }
    let c = 0xFFFFFFFF; for (let i=0;i<u8.length;i++) c = T[(c^u8[i])&255]^(c>>>8);
    return (c^0xFFFFFFFF)>>>0;
  }
  function buildZip(files){
    const enc = new TextEncoder(), now = new Date();
    const time = (now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);
    const date = ((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
    const es = files.map(f => ({nb: enc.encode(f.name), data: f.data, crc: crc32(f.data)}));
    let size = 22; for (const e of es) size += 30 + e.nb.length + e.data.length + 46 + e.nb.length;
    const out = new Uint8Array(size), dv = new DataView(out.buffer); let p = 0; const offs = [];
    for (const e of es){
      offs.push(p);
      dv.setUint32(p,0x04034b50,true); dv.setUint16(p+4,20,true); dv.setUint16(p+6,0x0800,true); dv.setUint16(p+8,0,true);
      dv.setUint16(p+10,time,true); dv.setUint16(p+12,date,true); dv.setUint32(p+14,e.crc,true);
      dv.setUint32(p+18,e.data.length,true); dv.setUint32(p+22,e.data.length,true);
      dv.setUint16(p+26,e.nb.length,true); dv.setUint16(p+28,0,true); p += 30;
      out.set(e.nb,p); p += e.nb.length; out.set(e.data,p); p += e.data.length;
    }
    const cd = p;
    es.forEach((e,i) => {
      dv.setUint32(p,0x02014b50,true); dv.setUint16(p+4,20,true); dv.setUint16(p+6,20,true); dv.setUint16(p+8,0x0800,true); dv.setUint16(p+10,0,true);
      dv.setUint16(p+12,time,true); dv.setUint16(p+14,date,true); dv.setUint32(p+16,e.crc,true);
      dv.setUint32(p+20,e.data.length,true); dv.setUint32(p+24,e.data.length,true);
      dv.setUint16(p+28,e.nb.length,true); dv.setUint16(p+30,0,true); dv.setUint16(p+32,0,true); dv.setUint16(p+34,0,true);
      dv.setUint16(p+36,0,true); dv.setUint32(p+38,0,true); dv.setUint32(p+42,offs[i],true); p += 46;
      out.set(e.nb,p); p += e.nb.length;
    });
    dv.setUint32(p,0x06054b50,true); dv.setUint16(p+4,0,true); dv.setUint16(p+6,0,true);
    dv.setUint16(p+8,es.length,true); dv.setUint16(p+10,es.length,true);
    dv.setUint32(p+12,p-cd,true); dv.setUint32(p+16,cd,true); dv.setUint16(p+20,0,true);
    return out;
  }
  async function readZip(buf){
    const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
    let e = -1;
    for (let i=buf.length-22; i>=Math.max(0,buf.length-22-65535); i--){ if (dv.getUint32(i,true)===0x06054b50){ e=i; break; } }
    if (e < 0) throw new Error('Das ist keine gültige ZIP-Datei.');
    const n = dv.getUint16(e+10,true); let p = dv.getUint32(e+16,true);
    const dec = new TextDecoder(), out = [];
    for (let i=0;i<n;i++){
      if (dv.getUint32(p,true) !== 0x02014b50) throw new Error('Die ZIP-Datei ist beschädigt.');
      const method = dv.getUint16(p+10,true), csize = dv.getUint32(p+20,true);
      const nl = dv.getUint16(p+28,true), xl = dv.getUint16(p+30,true), cl = dv.getUint16(p+32,true), lo = dv.getUint32(p+42,true);
      const name = dec.decode(buf.subarray(p+46,p+46+nl)).replace(/\\/g,'/');
      p += 46 + nl + xl + cl;
      if (name.endsWith('/')) continue;
      const start = lo + 30 + dv.getUint16(lo+26,true) + dv.getUint16(lo+28,true);
      const raw = buf.subarray(start, start+csize);
      let data;
      if (method === 0) data = raw.slice();
      else if (method === 8) data = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
      else throw new Error('Nicht unterstützte ZIP-Kompression bei ' + name);
      out.push({name, data});
    }
    return out;
  }

  /* --- Prüfung nach der Spezifikation --- */
  function validate(s){
    const out = [], E = m => out.push({level:'error',msg:m}), W = m => out.push({level:'warn',msg:m});
    if (!s.title.trim()) E('Disc-Einstellungen: Titel fehlt.');
    if (s.output.trim()){
      if (/[\\/:*?"<>|]/.test(s.output)) E('Disc-Einstellungen: Der EXE-Name enthält ungültige Zeichen.');
      else if (!/\.exe$/i.test(s.output.trim())) W('Disc-Einstellungen: Der EXE-Name sollte auf .exe enden.');
    }
    if (!s.games.length) E('Es wird mindestens ein Spiel benötigt.');
    const label = {dlcs:'DLC',patches:'Patch',extras:'Extra'};
    s.games.forEach((g,i) => {
      const gn = 'Spiel ' + i + ' (' + (g.name.trim() || 'ohne Namen') + ')';
      if (!g.name.trim()) E(gn + ': Name fehlt.');
      if (!g.installer.trim()) E(gn + ': Installer-Pfad fehlt.');
      else { const x = relPathIssue(g.installer.trim()); if (x) E(gn + ': Installer-Pfad ' + x + '.'); }
      if (String(g.estimatedSizeMB).trim() !== '' && !(Number(g.estimatedSizeMB) > 0)) E(gn + ': Die Größe muss eine Zahl über 0 sein.');
      SECTIONS.forEach(k => g[k].forEach((it,j) => {
        const n = gn + ', ' + label[k] + ' ' + (j+1) + ' (' + (it.name.trim() || 'ohne Namen') + ')';
        if (!it.name.trim()) E(n + ': Name fehlt.');
        const p = it.path.trim();
        if (!p) E(n + ': ' + (it.kind === 'installer' ? 'Installer-Pfad' : 'Pfad oder Link') + ' fehlt.');
        else if (it.kind === 'installer'){ const x = relPathIssue(p); if (x) E(n + ': Installer-Pfad ' + x + '.'); }
        else if (!isUrl(p)){ const x = relPathIssue(p); if (x) E(n + ': Pfad ' + x + '.'); }
      }));
    });
    return out;
  }

  /* --- Zustand -> menu.json + Asset-Dateien --- */
  function buildMenu(s, assets){
    const used = new Set(), map = new Map(), files = [];
    const take = (id, dir, base) => {
      if (!id || !assets.has(id)) return undefined;
      if (map.has(id)) return map.get(id);
      const a = assets.get(id), b = slug(base) || 'datei', d = 'assets/' + (dir ? dir + '/' : '');
      let p = d + b + '.' + a.ext, n = 2;
      while (used.has(p)) p = d + b + '-' + (n++) + '.' + a.ext;
      used.add(p); map.set(id,p); files.push({name:p, data:a.data}); return p;
    };
    const norm = p => p.trim().replace(/\\/g,'/');
    const itemOut = (it,g) => {
      const o = {name: it.name.trim()};
      if (it.description.trim()) o.description = it.description.trim();
      const c = take(it.cover,'covers', g.name + ' ' + it.name); if (c) o.cover = c;
      if (it.group.trim()) o.group = it.group.trim();
      if (it.kind === 'installer'){ o.installer = norm(it.path); const a = parseArgs(it.args); if (a.length) o.args = a; }
      else o.open = isUrl(it.path.trim()) ? it.path.trim() : norm(it.path);
      return o;
    };
    const m = {schemaVersion:1, title:s.title.trim()};
    if (s.output.trim()) m.output = s.output.trim();
    const bg = take(s.background,'','background'); if (bg) m.background = bg;
    const snd = {}; for (const k of ['click','hover']){ const p = take(s.sounds[k],'sounds',k); if (p) snd[k] = p; }
    if (Object.keys(snd).length) m.sounds = snd;
    m.games = s.games.map((g,i) => {
      const o = {index:i, name:g.name.trim()};
      const c = take(g.cover,'covers',g.name); if (c) o.cover = c;
      if (g.description.trim()) o.description = g.description.trim();
      o.installer = norm(g.installer);
      const a = parseArgs(g.args); if (a.length) o.args = a;
      if (String(g.estimatedSizeMB).trim() !== '') o.estimatedSizeMB = Number(g.estimatedSizeMB);
      SECTIONS.forEach(k => { if (g[k].length) o[k] = g[k].map(it => itemOut(it,g)); });
      return o;
    });
    return {menu:m, files};
  }

  /* --- menu.json -> Zustand (Import) --- */
  function parseMenu(m, getAsset){
    if (!m || typeof m !== 'object' || Array.isArray(m)) throw new Error('Die menu.json ist kein gültiges Objekt.');
    const notes = [], s = newState(); s.games = [];
    if (m.schemaVersion !== 1) notes.push('schemaVersion ' + m.schemaVersion + ' ist unbekannt, es wird Version 1 angenommen.');
    s.title = String(m.title || ''); s.output = String(m.output || '');
    const asset = p => { if (!p) return null; const id = getAsset(String(p)); if (!id) notes.push('Datei nicht gefunden: ' + p); return id || null; };
    s.background = asset(m.background);
    s.sounds.click = asset(m.sounds && m.sounds.click); s.sounds.hover = asset(m.sounds && m.sounds.hover);
    const item = it => {
      const o = newItem(); o._open = false;
      o.name = String(it.name || ''); o.description = String(it.description || ''); o.group = String(it.group || '');
      o.cover = asset(it.cover);
      if (it.installer != null){ o.kind = 'installer'; o.path = String(it.installer); o.args = fromArgs(it.args); }
      else { o.kind = 'open'; o.path = String(it.open || ''); }
      return o;
    };
    const games = (Array.isArray(m.games) ? m.games.slice() : []).sort((a,b) => (a.index || 0) - (b.index || 0));
    for (const g of games){
      const ng = newGame();
      ng.name = String(g.name || ''); ng.cover = asset(g.cover); ng.description = String(g.description || '');
      ng.installer = String(g.installer || ''); ng.args = fromArgs(g.args);
      ng.estimatedSizeMB = g.estimatedSizeMB == null ? '' : String(g.estimatedSizeMB);
      SECTIONS.forEach(k => { ng[k] = (Array.isArray(g[k]) ? g[k] : []).map(item); });
      if (g.customTabs) notes.push('"' + ng.name + '": customTabs gehören nicht zu Version 1 und werden nicht übernommen.');
      if (g.provider && g.provider !== 'gog') notes.push('"' + ng.name + '": provider "' + g.provider + '" wird nicht unterstützt und nicht übernommen.');
      s.games.push(ng);
    }
    if (!s.games.length) s.games.push(newGame());
    return {state:s, notes};
  }

  function usedIds(s){
    const ids = new Set(); const add = id => { if (id) ids.add(id); };
    add(s.background); add(s.sounds.click); add(s.sounds.hover);
    s.games.forEach(g => { add(g.cover); SECTIONS.forEach(k => g[k].forEach(it => add(it.cover))); });
    return ids;
  }
  function sane(s){
    return s && typeof s === 'object' && typeof s.title === 'string' && Array.isArray(s.games) && s.sounds &&
      s.games.every(g => g && SECTIONS.every(k => Array.isArray(g[k])));
  }
  /* --- Hilfen für die SteamGridDB-Anbindung --- */
  function htmlToText(s){
    const map = {amp:'&',lt:'<',gt:'>',quot:'"',apos:"'",nbsp:' '};
    return String(s || '').replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>/gi,'\n').replace(/<[^>]+>/g,'')
      .replace(/&(#x?[0-9a-f]+|[a-z]+);/gi, (m,e) => {
        if (e[0] === '#'){ try { const n = e[1].toLowerCase() === 'x' ? parseInt(e.slice(2),16) : parseInt(e.slice(1),10); return String.fromCodePoint(n); } catch (x) { return m; } }
        return map[e.toLowerCase()] !== undefined ? map[e.toLowerCase()] : m;
      }).replace(/\n{3,}/g,'\n\n').trim();
  }
  function normName(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9äöüß]+/g,''); }
  function rankByName(query, items, nameOf, max){
    const n = normName(query); if (!n) return [];
    const score = nm => { const m = normName(nm); if (!m) return 0; if (m === n) return 4; if (m.startsWith(n)) return 3; if (n.startsWith(m)) return 2; if (m.includes(n)) return 1; return 0; };
    return (items || []).map((it,i) => ({it, s: score(nameOf(it)), i})).filter(x => x.s > 0)
      .sort((a,b) => (b.s - a.s) || (a.i - b.i)).slice(0, max || 3).map(x => x.it);
  }
  function mdToText(t){
    return htmlToText(String(t || '').replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/^#{1,6}\s*/gm,'').replace(/(\*\*|__)/g,''));
  }
  function epicText(j){
    const pages = j && Array.isArray(j.pages) ? j.pages : [];
    for (const p of pages){
      const a = p && p.data && p.data.about; if (!a) continue;
      const t = a.shortDescription || a.description;
      if (t && String(t).trim()) return {title: String(a.title || p._title || j._title || ''), text: mdToText(t)};
    }
    return null;
  }
  function sortGrids(list){
    return (list || []).slice().sort((a,b) => ((b.language === 'de') - (a.language === 'de')) || ((b.score || 0) - (a.score || 0)));
  }
  function looksGerman(t){
    const text = String(t || ''), w = text.toLowerCase().match(/[a-zäöüß]+/g) || [];
    if (w.length < 8) return /[äöüß]/i.test(text);

    const list = (Array.isArray(j.products) ? j.products : []).map(p => ({id: String(p.id || p.productId || ''), title: String(p.title || p.name || ''), slug: p.slug || ''})).filter(p => p.id && p.title);
    const out = await Promise.all(rankByName(name, list, p => p.title, 3).map(async p => {
      const r2 = await net('https://api.gog.com/products/' + encodeURIComponent(p.id) + '?expand=description&locale=de-DE');
      if (!r2.ok) return null;
      const d = (await r2.json()).description; if (!d) return null;
      const text = CORE.trimIntro(htmlToText(d.full || d.lead || ''), 700);
      return text ? {label: 'GOG: ' + p.title, lang: looksGerman(text) ? 'de' : 'en', text, url: p.slug ? 'https://www.gog.com/game/' + p.slug : ''} : null;
    }));
    return out.filter(Boolean);
  }
  async function epicDescriptions(name){
    const base = slug(name), out = [];
    for (const sg of [...new Set([base, base.replace(/^the-/, '')])].filter(Boolean)){
      const r = await net('https://store-content.ak.epicgames.com/api/de/content/products/' + encodeURIComponent(sg));
      if (!r.ok) continue;
      const t = epicText(await r.json()); if (!t) continue;
      const text = CORE.trimIntro(t.text, 700);
      out.push({label: 'Epic Games Store: ' + (t.title || sg), lang: looksGerman(text) ? 'de' : 'en', text, url: 'https://store.epicgames.com/de/p/' + sg});
    }
    return out;
  }
  async function findDescriptions(name, game){
    const sources = [['Steam', () => steamDescriptions(name, game)], ['GOG', () => gogDescriptions(name)], ['Epic', () => epicDescriptions(name)]];
    const res = await Promise.allSettled(sources.map(([, fn]) => fn()));
    const items = [], failed = new Map();
    res.forEach((r, i) => {
      if (r.status === 'fulfilled') items.push(...r.value);
      else { const m = String((r.reason && r.reason.message) || r.reason); failed.set(m, (failed.get(m) || []).concat(sources[i][0])); }
    });
    const errors = [...failed].map(([m, names]) => names.join(', ') + ': ' + m);   // gleiche Meldung nur einmal zeigen
    items.sort((a,b) => (b.lang === 'de') - (a.lang === 'de'));
    return {items, errors};
  }
  async function translateToGerman(text){
    const out = [];
    for (const para of chunkText(text, 450)){
      const parts = [];
      for (const chunk of para){
        let r; try { r = await fetch('https://api.mymemory.translated.net/get?langpair=en%7Cde&q=' + encodeURIComponent(chunk)); } catch (e) { throw new Error('Der Übersetzungsdienst ist nicht erreichbar oder blockiert die Anfrage.'); }
        const j = await r.json().catch(() => null);
        if (!r.ok || !j || Number(j.responseStatus) !== 200 || !j.responseData) throw new Error((j && j.responseDetails) || 'Der Übersetzungsdienst hat nicht geantwortet.');
        parts.push(htmlToText(j.responseData.translatedText || ''));
      }
      out.push(parts.join(' '));
    }
    return out.join('\n');
  }

    if (typeof window.showSaveFilePicker !== 'function'){
      download(blob, name);
      toast('Exportiert: ' + name + ' (' + count + ' Datei(en) plus menu.json).\nDieser Browser kann vorhandene Dateien nicht überschreiben, jeder Export wird neu heruntergeladen. Dein Projekt bleibt unter "Projekte" gespeichert, exportiere also erst, wenn es fertig ist.');
      return;
    }
    const done = async handle => { const w = await handle.createWritable(); await w.write(blob); await w.close(); fileHandle = handle; await saveHandle(); closeDlg(); toast('Gespeichert in ' + handle.name); };
    const guard = fn => async () => { try { await fn(); } catch (e) { if (e && e.name === 'AbortError') return; toast('Speichern fehlgeschlagen: ' + (e.message || e)); } };
    openDlg('ZIP speichern', h('p', {class:'hint'}, 'Wie soll das Rezept gespeichert werden?'),
      h('div', {class:'list'},
        fileHandle ? h('button', {type:'button', class:'pri', onclick: guard(async () => {
          let p = await fileHandle.queryPermission({mode:'readwrite'}); if (p !== 'granted') p = await fileHandle.requestPermission({mode:'readwrite'});
          if (p !== 'granted') throw new Error('Keine Schreibberechtigung für die Datei.'); await done(fileHandle);
        })}, 'In "' + fileHandle.name + '" überschreiben') : null,
        h('button', {type:'button', onclick: guard(async () => { await done(await window.showSaveFilePicker({suggestedName: name, types:[{description:'ZIP-Datei', accept:{'application/zip':['.zip']}}]})); })}, 'Speichern unter ...'),
        h('button', {type:'button', onclick: () => { download(blob, name); closeDlg(); toast('Heruntergeladen: ' + name); }}, 'Als normalen Download')));
  });
  async function importFile(f, handle){
    try {
      let menu, files = [];
      if (/\.json$/i.test(f.name)) menu = JSON.parse(await f.text());
      else {
        files = await readZip(new Uint8Array(await f.arrayBuffer()));
        const mj = files.find(x => x.name === 'menu.json');
        if (!mj) throw new Error('In der ZIP fehlt die menu.json im Wurzelverzeichnis.');
        menu = JSON.parse(new TextDecoder().decode(mj.data));
      }
      const byPath = new Map(files.map(x => [x.name, x.data])), ids = new Map(), imp = new Map();
      const getAsset = p => {
        p = p.replace(/\\/g,'/'); if (ids.has(p)) return ids.get(p);
        const d = byPath.get(p); if (!d) return null;
        const id = 'a' + (counter++); imp.set(id, {data:d, ext:(p.split('.').pop() || '').toLowerCase()}); ids.set(p,id); return id;
      };
      const r = parseMenu(menu, getAsset);
      await switchToNew(r.state, imp, /\.zip$/i.test(f.name) ? handle : null);
      toast(r.notes.length ? 'Als neues Projekt importiert, mit Hinweisen:\n' + r.notes.slice(0,6).join('\n') + (r.notes.length > 6 ? '\n... und ' + (r.notes.length-6) + ' weitere' : '') : 'Als neues Projekt importiert. Die Dateien liegen jetzt im Browser, die Original-ZIP wird nicht mehr gebraucht.');
    } catch (err) { toast('Import fehlgeschlagen: ' + (err.message || err)); }
  }
  $('#bImp').addEventListener('click', async () => {
    if (typeof window.showOpenFilePicker === 'function'){
      try { const [hd] = await window.showOpenFilePicker({types:[{description:'Rezept (ZIP oder JSON)', accept:{'application/zip':['.zip'],'application/json':['.json']}}]}); await importFile(await hd.getFile(), hd); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    $('#impFile').click();
  });
  $('#impFile').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if (f) await importFile(f, null); });
  $('#bProj').addEventListener('click', openProjects);
  $('#bSave').addEventListener('click', async () => { const ok = await save(); toast(ok ? 'Projekt "' + projTitle() + '" im Browser gespeichert.' : 'Speichern im Browser ist nicht möglich (Speicher gesperrt oder voll).'); });

  $('#bSg').addEventListener('click', openSettings);
  $('#dlgX').addEventListener('click', closeDlg);
  restore().then(renderAll);
  renderAll();
})();
</script>
</body>
</html>
