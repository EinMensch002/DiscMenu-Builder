<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiscMenu-Konfigurator</title>
<style>
:root{--bg:#0e1015;--panel:#181c24;--panel2:#212633;--line:#2c3240;--txt:#e9ecf3;--mut:#98a2b6;--acc:#5b8cff;--acc2:#8f6bff;--err:#ff6b6b;--warn:#f0b429;--ok:#3ddc97;--shadow:0 8px 28px rgba(0,0,0,.32)}
@media (prefers-color-scheme:light){:root{--bg:#f0f3f9;--panel:#fff;--panel2:#f2f5fb;--line:#d9dfec;--txt:#171b26;--mut:#5b6579;--acc:#2f6fed;--acc2:#6a4df0;--err:#d93a3a;--warn:#a86f00;--ok:#14935f;--shadow:0 8px 24px rgba(30,40,70,.10)}}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
body{margin:0;color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1100px 480px at 12% -8%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%),radial-gradient(900px 420px at 100% 0,color-mix(in srgb,var(--acc2) 12%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
a{color:var(--acc);text-underline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 18px;background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;letter-spacing:.2px}
header .btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:500;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;transition:border-color .15s,transform .1s,background .15s,box-shadow .15s}
button:hover{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--panel2))}
button:active{transform:scale(.98)}
button.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 35%,transparent)}
button.pri:hover{filter:brightness(1.08)}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
button.sm{padding:4px 10px;font-size:13px;border-radius:8px}
button.danger:hover{border-color:var(--err);color:var(--err);background:color-mix(in srgb,var(--err) 10%,var(--panel2))}
main{display:grid;grid-template-columns:240px minmax(0,1fr) 310px;gap:18px;padding:18px;max-width:1500px;margin:0 auto}
@media (max-width:1100px){main{grid-template-columns:210px minmax(0,1fr)}#side{grid-column:1/-1}}
@media (max-width:700px){main{grid-template-columns:1fr;padding:12px}#nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}.nv{white-space:nowrap;width:auto}}
#nav{display:flex;flex-direction:column;gap:8px;align-self:start;position:sticky;top:78px}
@media (max-width:700px){#nav{position:static}}
.nv{text-align:left;width:100%;background:var(--panel);border-radius:12px}
.nv.on{border-color:var(--acc);background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 22%,var(--panel)),var(--panel));box-shadow:inset 3px 0 0 var(--acc)}
.nv.add{border-style:dashed;color:var(--mut);background:transparent}
.nv.add:hover{color:var(--txt)}
#editor,#side .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
#side{display:flex;flex-direction:column;gap:16px;align-self:start;position:sticky;top:78px}
@media (max-width:1100px){#side{position:static}}
h2{margin:0 0 4px;font-size:21px;letter-spacing:.2px}
h3{margin:24px 0 6px;font-size:15px;display:flex;align-items:center;gap:8px}
h3::before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(var(--acc),var(--acc2))}
.hint,small{color:var(--mut);font-size:13px}
.f{display:flex;flex-direction:column;gap:5px;margin:12px 0}
.lab{font-size:13px;color:var(--mut);font-weight:500}
input[type=text],input[type=number],input[type=password],input:not([type]),select,textarea{font:inherit;color:var(--txt);background:color-mix(in srgb,var(--bg) 60%,var(--panel));border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;transition:border-color .15s,box-shadow .15s}
input:hover,textarea:hover,select:hover{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drop{display:flex;align-items:center;gap:12px;min-height:72px;padding:10px;border:2px dashed var(--line);border-radius:12px;cursor:pointer;background:color-mix(in srgb,var(--bg) 55%,var(--panel));transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--panel))}
.drop img{max-height:64px;max-width:100px;border-radius:8px;object-fit:contain;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.drop audio{height:32px;max-width:220px}
.meta{color:var(--mut);font-size:12px}
.card{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:var(--panel2);transition:border-color .15s}
.card[open]{border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
.card summary{cursor:pointer;padding:11px 14px;display:flex;gap:8px;align-items:center;font-weight:500;border-radius:12px}
.card summary:hover{background:color-mix(in srgb,var(--acc) 7%,transparent)}
.card .body{padding:0 14px 14px}
.chip{font-size:12px;border:1px solid color-mix(in srgb,var(--acc) 45%,var(--line));background:color-mix(in srgb,var(--acc) 12%,transparent);border-radius:99px;padding:0 9px;color:var(--acc)}
.issue{margin:5px 0;font-size:13px;padding-left:10px;border-left:3px solid transparent}
.issue.error{color:var(--err);border-left-color:var(--err)}.issue.warn{color:var(--warn);border-left-color:var(--warn)}.ok{color:var(--ok)}
pre{margin:8px 0 0;max-height:360px;overflow:auto;font:12px/1.45 ui-monospace,Consolas,monospace;background:color-mix(in srgb,var(--bg) 60%,var(--panel));border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre-wrap;word-break:break-word}
details.box>summary{cursor:pointer;font-weight:600}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,10px);background:var(--panel2);border:1px solid var(--acc);border-radius:12px;padding:11px 16px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;white-space:pre-line;box-shadow:var(--shadow)}
#toast.on{opacity:1;transform:translate(-50%,0)}
dialog{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(800px,94vw);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(5,7,12,.6);backdrop-filter:blur(3px)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.dh h2{margin:0;font-size:19px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.list button{text-align:left}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:10px;margin:12px 0}
.gal button{padding:5px;display:flex;flex-direction:column;gap:5px;align-items:center;border-radius:12px;overflow:hidden}
.gal img{width:100%;height:156px;object-fit:contain;background:color-mix(in srgb,var(--bg) 60%,var(--panel));border-radius:8px;transition:transform .15s}
.gal button:hover img{transform:scale(1.04)}
.gal button.sel{border-color:var(--ok);outline:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--panel2))}
.gal small{font-size:11px}
.sgbtn{align-self:flex-start}

.simbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:8px 0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.simbar label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mut)}
.simbar select{padding:4px 8px}
.stagewrap{position:relative;width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0e1016}
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#0e1016;color:#ecf0f5;font:16px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;user-select:none}
.stage *{box-sizing:border-box}
.stage .bgimg{position:absolute;inset:0;background:center/cover no-repeat}
.stage .shade{position:absolute;inset:0;background:rgba(8,10,16,.28)}
.stage .abs{position:absolute}
.stage .sbtn{border:0;border-radius:10px;background:#282d3a;color:#ecf0f5;font:17px system-ui,"Segoe UI",sans-serif;height:40px;padding:0 16px;cursor:pointer;display:flex;align-items:center;justify-content:center;white-space:nowrap;transition:background .1s}
.stage .sbtn:hover{background:#363d50}
.stage .sbtn.main{font-weight:700;color:var(--ink,#fff)}
.stage .sbtn.main:hover{filter:brightness(1.1)}
.stage .sbtn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.stage .badge{display:inline-flex;align-items:center;border-radius:99px;padding:1px 11px;font-weight:700;vertical-align:middle}
.stage .cover{background:#282d3a;display:flex;align-items:center;justify-content:center;text-align:center;color:#a0a8b8;font-weight:700;overflow:hidden}
.stage .cover img{width:100%;height:100%;object-fit:contain}
.stage .tile{width:200px;cursor:pointer;padding:8px;margin:-8px;border-radius:14px;position:relative;transition:background .1s}
.stage .tile:hover{background:rgba(27,31,41,.92)}
.stage .tile .bar{position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:0 0 14px 14px;opacity:0}
.stage .tile:hover .bar{opacity:1}
.stage .panel{background:rgba(27,31,41,.92);border-radius:14px}
.stage .sbtn.tab{height:40px;font-size:18px;font-weight:700;padding:0 20px}
.stage .row{background:#282d3a;border-radius:12px;padding:14px 16px;margin:0 14px 10px 0;display:flex;gap:12px;align-items:center;min-height:76px}
.stage .row .tx{flex:1;min-width:0}
.stage .row .tx b{font-size:18px;display:block}
.stage .row .tx span{color:#a0a8b8;font-size:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.stage .grp{font-size:14px;font-weight:700;text-transform:uppercase;margin:8px 0 8px}
.stage .chk{display:flex;gap:12px;align-items:center;height:32px;font-size:17px;cursor:pointer}
.stage .chk i{width:24px;height:24px;border-radius:6px;background:#282d3a;display:block;position:relative}
.stage .chk i.on::after{content:"";position:absolute;inset:4px;border-radius:4px;background:var(--acc-c)}
.stage input.fld{height:42px;border-radius:8px;border:0;border-bottom:3px solid transparent;background:#12151d;color:#ecf0f5;font:17px system-ui,"Segoe UI",sans-serif;padding:0 12px;flex:1;min-width:0;user-select:text}
.stage input.fld:focus{outline:none;border-bottom-color:var(--acc-c)}
.stage .scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent}
.stage .ovl{position:absolute;inset:0;background:rgba(6,8,14,.75);display:flex;align-items:center;justify-content:center}
.stage .box{width:760px;max-width:92%;background:#282d3a;border-radius:16px;padding:24px 28px 28px;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.stage .box .top{position:absolute;left:0;right:0;top:0;height:5px}
.stage .box h4{margin:4px 0 14px;font-size:24px}
.stage .box pre{white-space:pre-wrap;font:16px/1.45 system-ui,"Segoe UI",sans-serif;margin:0 0 18px;max-height:300px;overflow:auto;border:0;background:none;padding:0;color:#ecf0f5}
.stage .prog{height:14px;border-radius:7px;background:#363d50;overflow:hidden;position:relative}
.stage .prog i{display:block;height:100%;border-radius:7px;min-width:14px}
.stage .prog i.ind{position:absolute;width:33%;animation:slide 1.6s linear infinite}
@keyframes slide{from{left:-33%}to{left:100%}}
.stage .win{position:absolute;left:50%;top:50%;width:560px;transform:translate(-50%,-48%);background:#f0f0f0;color:#111;border-radius:6px;box-shadow:0 12px 50px rgba(0,0,0,.7);font:14px/1.45 "Segoe UI",system-ui,sans-serif;overflow:hidden;z-index:3}
.stage .win .tb{background:#fff;padding:8px 12px;display:flex;justify-content:space-between;border-bottom:1px solid #ddd;font-size:13px}
.stage .win .bd{padding:22px 24px;min-height:200px}
.stage .win .bd h5{margin:0 0 10px;font-size:18px;font-weight:600}
.stage .win .ft{padding:12px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid #ddd;background:#e8e8e8}
.stage .win button{font:14px "Segoe UI",system-ui,sans-serif;border:1px solid #adadad;background:#e1e1e1;border-radius:3px;padding:5px 18px;cursor:pointer;color:#111}
.stage .win button:hover{background:#e5f1fb;border-color:#0078d4}
.stage .win .wp{height:20px;background:#e6e6e6;border:1px solid #bcbcbc;margin-top:14px}
.stage .win .wp i{display:block;height:100%;background:#06b025}

.stage .cw{position:absolute;left:250px;top:18px;width:780px;height:684px;background:#f0f0f0;color:#111;border:1px solid #6b6b6b;border-radius:8px;box-shadow:0 18px 60px rgba(0,0,0,.65);font:15px/1.35 "Segoe UI",system-ui,Roboto,sans-serif;overflow:hidden;display:flex;flex-direction:column}
.stage .cw .ttl{height:36px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 0 0 14px;border-bottom:1px solid #d0d0d0;flex:none}
.stage .cw .ttl b{font-weight:400;font-size:14px}
.stage .cw .ttl .wb{margin-left:auto;display:flex}
.stage .cw .ttl .wb span{width:46px;height:36px;display:flex;align-items:center;justify-content:center;color:#444;font-size:16px}
.stage .cw .ttl .wb span.x{cursor:pointer}.stage .cw .ttl .wb span.x:hover{background:#c42b1c;color:#fff}
.stage .cw .bar{height:3px;flex:none}
.stage .cw .cols{flex:1;display:flex;gap:16px;padding:16px 16px 10px;min-height:0}
.stage .cw .lc{width:360px;flex:none;display:flex;flex-direction:column;min-height:0}
.stage .cw .cbox{height:372px;flex:none;background:#1a1a1a;border:1px solid #8a8a8a;box-shadow:inset 0 0 0 1px #fff;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#bbb;text-align:center;font-size:22px;font-weight:600;padding:12px}
.stage .cw .cbox img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.stage .cw .lname{font-size:17px;font-weight:600;margin:10px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.stage .cw .ldesc{flex:1;min-height:0;overflow-y:auto;font-size:13.5px;color:#222;white-space:pre-wrap;padding-right:6px;scrollbar-width:thin}
.stage .cw .ldesc.mut{color:#777}
.stage .cw .rc{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.stage .cw .rtop{flex:1;min-height:0;overflow-y:auto;padding-right:4px;scrollbar-width:thin}
.stage .cw .rc>div:last-child{margin-right:4px}
.stage .cw .rule{height:2px;border-top:1px solid #a0a0a0;border-bottom:1px solid #fff;margin:8px 0}
.stage .cw .cbtn{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;margin:6px 0;padding:6px 44px 6px 58px;background:linear-gradient(#fcfcfc,#e4e4e4 52%,#d8d8d8);border:1px solid #9a9a9a;border-radius:3px;box-shadow:inset 0 1px 0 #fff;font:15px/1.2 "Segoe UI",system-ui,sans-serif;color:#111;cursor:pointer;text-align:center}
.stage .cw .cbtn:hover{background:linear-gradient(#f6fbff,#dcecfa 52%,#cfe4f7);border-color:#3c7fb1}
.stage .cw .cbtn:active{background:#c4dff5}
.stage .cw .cbtn.main{font-weight:700;font-size:17px;min-height:58px}
.stage .cw .cbtn[disabled]{opacity:.5;cursor:not-allowed;background:#e8e8e8}
.stage .cw .cbtn .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:block}
.stage .cw .cbtn .ic svg{width:34px;height:34px;display:block}
.stage .cw .cbtn .tg{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:#555}
.stage .cw .cbtn .lb{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stage .cw .ghd{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#444;margin:12px 2px 0}
.stage .cw .note{font-size:12.5px;color:#555;margin:2px 4px 6px}
.stage .cw .opts{flex:none;border-top:1px solid #a0a0a0;box-shadow:0 -1px 0 #fff;padding:10px 16px 12px;background:#ececec}
.stage .cw .opts label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.stage .cw .opts input[type=checkbox]{width:16px;height:16px;margin:0;cursor:pointer}
.stage .cw .opts .tr{display:flex;gap:8px;align-items:center;margin-top:8px}
.stage .cw .opts .tr span{font-size:13.5px;width:76px}
.stage .cw .opts input.fld2{flex:1;min-width:0;height:28px;border:1px solid #7a7a7a;background:#fff;font:14px "Segoe UI",system-ui,sans-serif;padding:0 8px;user-select:text;color:#111}
.stage .cw .opts button{height:28px;padding:0 14px;border:1px solid #9a9a9a;border-radius:3px;background:linear-gradient(#fcfcfc,#e0e0e0);font:14px "Segoe UI",system-ui,sans-serif;cursor:pointer;color:#111}
.stage .cw .opts button:hover{border-color:#3c7fb1;background:#dcecfa}
.simlog{margin:10px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);font:12.5px/1.5 ui-monospace,Consolas,monospace;max-height:150px;overflow:auto;color:var(--mut)}
.simlog div b{color:var(--txt);font-weight:600}
dialog.wide{width:min(1360px,98vw)}
textarea.code{width:100%;min-height:50vh;font:12.5px/1.5 ui-monospace,Consolas,monospace;white-space:pre;tab-size:2;resize:vertical}
footer{text-align:center;color:var(--mut);font-size:12px;padding:8px 14px 28px;line-height:1.8}
</style>
</head>
<body>
<header>
  <div><h1 style="display:inline">💿 DiscMenu-Konfigurator</h1> <span id="savedAt" class="hint"></span></div>
  <div class="btns">
    <button id="bProj" type="button">Projekte</button>
    <button id="bSave" type="button">Speichern</button>
    <button id="bPrev" type="button">Vorschau</button>
    <button id="bJson" type="button">JSON</button>
    <button id="bSg" type="button">SteamGridDB</button>
    <button id="bImp" type="button">Importieren</button>
    <button id="bExp" type="button" class="pri">Als ZIP exportieren</button>
  </div>
</header>
<main>
  <nav id="nav" aria-label="Spiele"></nav>
  <section id="editor"></section>
  <aside id="side"></aside>
</main>
<footer>Läuft komplett in deinem Browser. Es wird nichts hochgeladen. Der Entwurf wird lokal im Browser zwischengespeichert.<br>
<a href="https://github.com/EinMensch002/DiscMenu-Builder/blob/main/docs/configurator.md" target="_blank" rel="noopener noreferrer">Anleitung</a> ·
<a href="https://github.com/EinMensch002/DiscMenu-Builder/blob/main/docs/steamgriddb.md" target="_blank" rel="noopener noreferrer">SteamGridDB, Beschreibungen und Proxy</a> ·
<a href="disc-sleeve/">DiscSleeve: Hüllen für Disc-Spiele</a> ·
<a href="https://github.com/EinMensch002/DiscMenu-Builder" target="_blank" rel="noopener noreferrer">Quellcode</a> ·
<a href="https://www.steamgriddb.com/" target="_blank" rel="noopener noreferrer">SteamGridDB</a></footer>
<input id="impFile" type="file" accept=".zip,.json" hidden>
<dialog id="dlg"><div class="dh"><h2 id="dlgTitle"></h2><button type="button" class="sm" id="dlgX">Schließen</button></div><div id="dlgBody"></div></dialog>
<div id="toast" role="status"></div>
<script>
/* === KERN (ohne DOM, wird auch in Tests verwendet) === */
const CORE = (() => {
  const UML = {'ä':'ae','ö':'oe','ü':'ue','Ä':'ae','Ö':'oe','Ü':'ue','ß':'ss'};
  const SECTIONS = ['dlcs','patches','extras'];
  // Aussehen und Verhalten je Anbieter. Muss zu src/Player/providers.go passen (ein Test vergleicht die Befehlszeilen).
  const PROVIDERS = {
    gog:{name:'GOG', color:'#9e4ebe', accent:'#9e4ebe', badge:'#763494', onBadge:'#ffffff', note:'', canInstall:true, usesTarget:true, silent:'always'},
    epic:{name:'Epic Games', color:'#8d93a5', accent:'#d6dae4', badge:'#34363e', onBadge:'#ffffff', note:'Epic hat keine einheitlichen Offline-Installer. Der Player startet sie normal, still nur mit eigenen Parametern.', canInstall:true, usesTarget:false, silent:'args'},
    steam:{name:'Steam', color:'#66c0f4', accent:'#66c0f4', badge:'#223e5c', onBadge:'#96d6ff', note:'Steam-Backups kann der Player noch nicht wiederherstellen. Der Eintrag wird nur angezeigt, Extras lassen sich öffnen.', canInstall:false, usesTarget:false, silent:'never'}

  /* --- Prüfung nach der Spezifikation --- */

  /* --- Zustand -> menu.json + Asset-Dateien --- */

  /* --- menu.json -> Zustand (Import) --- */
  function parseMenu(m, getAsset){

    s.title = String(m.title || ''); s.output = String(m.output || '');
    const asset = p => { if (!p) return null; const id = getAsset(String(p)); if (!id) notes.push('Datei nicht gefunden: ' + p); return id || null; };
    s.background = asset(m.background);
    s.sounds.click = asset(m.sounds && m.sounds.click); s.sounds.hover = asset(m.sounds && m.sounds.hover);
    const item = it => {
      const o = newItem(); o._open = false;
      o.name = String(it.name || ''); o.description = String(it.description || ''); o.group = String(it.group || '');
      o.cover = asset(it.cover);
      if (it.installer != null){ o.kind = 'installer'; o.path = String(it.installer); o.args = fromArgs(it.args); }
      else { o.kind = 'open'; o.path = String(it.open || ''); }

    };
    const games = (Array.isArray(m.games) ? m.games.slice() : []).sort((a,b) => (a.index || 0) - (b.index || 0));
    for (const g of games){
      const ng = newGame();
      ng.name = String(g.name || ''); ng.cover = asset(g.cover); ng.description = String(g.description || '');
      ng.installer = String(g.installer || ''); ng.args = fromArgs(g.args);
      ng.estimatedSizeMB = g.estimatedSizeMB == null ? '' : String(g.estimatedSizeMB);
      SECTIONS.forEach(k => { ng[k] = (Array.isArray(g[k]) ? g[k] : []).map(item); });

      if (g.provider){ if (PROVIDERS[g.provider]) ng.provider = g.provider; else notes.push('"' + ng.name + '": provider "' + g.provider + '" ist unbekannt, es wird gog angenommen.'); }

  function usedIds(s){

  /* --- Disc-Dateien prüfen (exists(pfad) liefert 'file', 'dir' oder null) --- */

      if (g.installer.trim()) refs.push({where: gn + ', Installer', path: norm(g.installer), mustBeFile: true});
      SECTIONS.forEach(k => g[k].forEach((it,j) => {

  async function gogDescriptions(name){
    const q = new URLSearchParams({limit:'10', query:'like:' + name, order:'desc:score', productType:'in:game,pack,dlc', page:'1', countryCode:'DE', locale:'de-DE', currencyCode:'EUR'});
    const r = await net('https://catalog.gog.com/v1/catalog?' + q.toString());
    if (!r.ok) throw new Error('GOG hat mit Fehler ' + r.status + ' geantwortet.');
    const j = await r.json();
    const list = (Array.isArray(j.products) ? j.products : []).map(p => ({id: String(p.id || p.productId || ''), title: String(p.title || p.name || ''), slug: p.slug || ''})).filter(p => p.id && p.title);
    const out = await Promise.all(rankByName(name, list, p => p.title, 3).map(async p => {
      const r2 = await net('https://api.gog.com/products/' + encodeURIComponent(p.id) + '?expand=description&locale=de-DE');
      if (!r2.ok) return null;
      const d = (await r2.json()).description; if (!d) return null;
      const text = CORE.trimIntro(htmlToText(d.full || d.lead || ''), 700);
      return text ? {label: 'GOG: ' + p.title, lang: looksGerman(text) ? 'de' : 'en', text, url: p.slug ? 'https://www.gog.com/game/' + p.slug : ''} : null;
    }));

  async function epicDescriptions(name){
    const base = slug(name), out = [];
    for (const sg of [...new Set([base, base.replace(/^the-/, '')])].filter(Boolean)){
      const r = await net('https://store-content.ak.epicgames.com/api/de/content/products/' + encodeURIComponent(sg));
      if (!r.ok) continue;
      const t = epicText(await r.json()); if (!t) continue;
      const text = CORE.trimIntro(t.text, 700);
      out.push({label: 'Epic Games Store: ' + (t.title || sg), lang: looksGerman(text) ? 'de' : 'en', text, url: 'https://store.epicgames.com/de/p/' + sg});
    }
    return out;
  }
  async function findDescriptions(name, game){
    const sources = [['Steam', () => steamDescriptions(name, game)], ['GOG', () => gogDescriptions(name)], ['Epic', () => epicDescriptions(name)]];
    const res = await Promise.allSettled(sources.map(([, fn]) => fn()));
    const items = [], failed = new Map();
    res.forEach((r, i) => {
      if (r.status === 'fulfilled') items.push(...r.value);
      else { const m = String((r.reason && r.reason.message) || r.reason); failed.set(m, (failed.get(m) || []).concat(sources[i][0])); }
    });
    const errors = [...failed].map(([m, names]) => names.join(', ') + ': ' + m);   // gleiche Meldung nur einmal zeigen
    items.sort((a,b) => (b.lang === 'de') - (a.lang === 'de'));
    return {items, errors};
  }
  async function translateToGerman(text){
    const out = [];
    for (const para of chunkText(text, 450)){
      const parts = [];
      for (const chunk of para){
        let r; try { r = await fetch('https://api.mymemory.translated.net/get?langpair=en%7Cde&q=' + encodeURIComponent(chunk)); } catch (e) { throw new Error('Der Übersetzungsdienst ist nicht erreichbar oder blockiert die Anfrage.'); }
        const j = await r.json().catch(() => null);
        if (!r.ok || !j || Number(j.responseStatus) !== 200 || !j.responseData) throw new Error((j && j.responseDetails) || 'Der Übersetzungsdienst hat nicht geantwortet.');
        parts.push(htmlToText(j.responseData.translatedText || ''));
      }
      out.push(parts.join(' '));
    }
    return out.join('\n');
  }

  /* --- Disc-Ordner prüfen --- */
  async function resolveIn(root, path){
    let dir = root; const parts = path.split('/').filter(Boolean);
    const find = async (d, name) => {              // exakt, sonst ohne Beachtung der Groß-/Kleinschreibung (Discs sind meist unempfindlich)
      for (const kind of ['getDirectoryHandle','getFileHandle']){ try { return [kind === 'getDirectoryHandle' ? 'dir' : 'file', await d[kind](name)]; } catch (e) { /* weiter */ } }
      for await (const [n, hd] of d.entries()) if (n.toLowerCase() === name.toLowerCase()) return [hd.kind === 'directory' ? 'dir' : 'file', hd];
      return null;
    };
    for (let i = 0; i < parts.length; i++){
      const r = await find(dir, parts[i]); if (!r) return null;
      if (i === parts.length - 1) return r[0];
      if (r[0] !== 'dir') return null; dir = r[1];
    }
    return 'dir';
  }
  async function runDiscCheck(){
    let root; try { root = await window.showDirectoryPicker({mode:'read'}); } catch (e) { if (!(e && e.name === 'AbortError')) toast('Ordner konnte nicht geöffnet werden: ' + (e.message || e)); return; }
    openDlg('Disc-Ordner wird geprüft ...', h('p', {class:'hint'}, 'Einen Moment.'));
    const r = await checkDisc(state, p => resolveIn(root, p));
    const errs = r.issues.filter(i => i.level === 'error').length;
    openDlg('Disc-Prüfung: ' + root.name,
      h('p', {class: errs ? 'issue error' : 'ok'}, errs ? errs + ' Problem(e) bei ' + r.checked + ' geprüften Pfaden.' : 'Alle ' + r.checked + ' Pfade gefunden.'),
      r.issues.map(i => h('div', {class:'issue ' + i.level}, (i.level === 'error' ? 'Fehler: ' : 'Hinweis: ') + i.msg)),
      h('p', {class:'hint'}, 'Es wird nur gelesen, nichts verändert und nichts hochgeladen. Der Ordner sollte so aufgebaut sein wie die fertige Disc (Wurzel = Ordner, in dem die Menü-EXE liegt).'));
  }

      h('b', {}, 'Simulation'),
      h('label', {}, 'Ergebnis der Installation ', sel([['ok','Erfolg'],['err1','Fehler (Code 1, Platte voll)'],['err5','Fehler (Code 5, Rechte fehlen)']], S.result, v => { S.result = v; say('Ergebnis der nächsten Installation: ' + v); })),
      h('label', {}, 'Tempo ', sel([['1','Normal'],['3','Schnell'],['0.4','Langsam']], '1', v => { S.speed = Number(v); })),
      h('button', {type:'button', class:'sm', onclick: () => { S.timers.forEach(stop); S.modal = null; S.silent = false; S.targets = {}; S.page = state.games.length > 1 ? 'select' : 'game'; S.cat = null; S.focus = null; S.log = []; say('Zurückgesetzt'); draw(); }}, 'Zurücksetzen'));
    dlg.classList.add('wide');
    openDlg('Vorschau und Simulation',
      h('p', {class:'hint'}, 'Bildet das Menü nach, wie es der Player zeigt: Layout, Farben und Abzeichen je Anbieter. Klicken, Reiter, "Stille Installation" und Installieren funktionieren. Installiert wird nichts, es ist eine Simulation. Die Schrift ist hier die des Systems, im Player ist es Go Regular.'),
      bar, wrap, h('div', {class:'hint', style:'margin-top:10px'}, 'Ablauf (so würde der Player den Installer starten):'), logBox);
    fit(); say('Vorschau gestartet. Tipp: Oben das Ergebnis wählen, dann im Menü auf "Installieren" klicken.'); draw();
  }
  $('#bPrev').addEventListener('click', openPreview);
  $('#bJson').addEventListener('click', openJsonEditor);

  /* --- Export / Import --- */
  function download(blob, name){ const a = h('a',{href:URL.createObjectURL(blob),download:name}); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
  const zipName = () => (slug(state.title) || 'rezept') + '.zip';
  function buildZipBlob(){
    const {menu, files} = buildMenu(state, assets);
    const zip = buildZip([{name:'menu.json', data:new TextEncoder().encode(JSON.stringify(menu,null,2) + '\n')}, ...files]);
    return {blob: new Blob([zip], {type:'application/zip'}), count: files.length};
  }
  $('#bExp').addEventListener('click', () => {
    if (validate(state).some(i => i.level === 'error')){ toast('Bitte zuerst die Fehler beheben.'); return; }
    const {blob, count} = buildZipBlob(), name = zipName();
    if (typeof window.showSaveFilePicker !== 'function'){
      download(blob, name);
      toast('Exportiert: ' + name + ' (' + count + ' Datei(en) plus menu.json).\nDieser Browser kann vorhandene Dateien nicht überschreiben, jeder Export wird neu heruntergeladen. Dein Projekt bleibt unter "Projekte" gespeichert, exportiere also erst, wenn es fertig ist.');
      return;
    }
    const done = async handle => { const w = await handle.createWritable(); await w.write(blob); await w.close(); fileHandle = handle; await saveHandle(); closeDlg(); toast('Gespeichert in ' + handle.name); };
    const guard = fn => async () => { try { await fn(); } catch (e) { if (e && e.name === 'AbortError') return; toast('Speichern fehlgeschlagen: ' + (e.message || e)); } };
    openDlg('ZIP speichern', h('p', {class:'hint'}, 'Wie soll das Rezept gespeichert werden?'),
      h('div', {class:'list'},
        fileHandle ? h('button', {type:'button', class:'pri', onclick: guard(async () => {
          let p = await fileHandle.queryPermission({mode:'readwrite'}); if (p !== 'granted') p = await fileHandle.requestPermission({mode:'readwrite'});
          if (p !== 'granted') throw new Error('Keine Schreibberechtigung für die Datei.'); await done(fileHandle);
        })}, 'In "' + fileHandle.name + '" überschreiben') : null,
        h('button', {type:'button', onclick: guard(async () => { await done(await window.showSaveFilePicker({suggestedName: name, types:[{description:'ZIP-Datei', accept:{'application/zip':['.zip']}}]})); })}, 'Speichern unter ...'),
        h('button', {type:'button', onclick: () => { download(blob, name); closeDlg(); toast('Heruntergeladen: ' + name); }}, 'Als normalen Download')));
  });
  async function importFile(f, handle){
    try {
      let menu, files = [];
      if (/\.json$/i.test(f.name)) menu = JSON.parse(await f.text());
      else {
        files = await readZip(new Uint8Array(await f.arrayBuffer()));
        const mj = files.find(x => x.name === 'menu.json');
        if (!mj) throw new Error('In der ZIP fehlt die menu.json im Wurzelverzeichnis.');
        menu = JSON.parse(new TextDecoder().decode(mj.data));
      }
      const byPath = new Map(files.map(x => [x.name, x.data])), ids = new Map(), imp = new Map();
      const getAsset = p => {
        p = p.replace(/\\/g,'/'); if (ids.has(p)) return ids.get(p);
        const d = byPath.get(p); if (!d) return null;
        const id = 'a' + (counter++); imp.set(id, {data:d, ext:(p.split('.').pop() || '').toLowerCase()}); ids.set(p,id); return id;
      };
      const r = parseMenu(menu, getAsset);
      await switchToNew(r.state, imp, /\.zip$/i.test(f.name) ? handle : null);
      toast(r.notes.length ? 'Als neues Projekt importiert, mit Hinweisen:\n' + r.notes.slice(0,6).join('\n') + (r.notes.length > 6 ? '\n... und ' + (r.notes.length-6) + ' weitere' : '') : 'Als neues Projekt importiert. Die Dateien liegen jetzt im Browser, die Original-ZIP wird nicht mehr gebraucht.');
    } catch (err) { toast('Import fehlgeschlagen: ' + (err.message || err)); }
  }
  $('#bImp').addEventListener('click', async () => {
    if (typeof window.showOpenFilePicker === 'function'){
      try { const [hd] = await window.showOpenFilePicker({types:[{description:'Rezept (ZIP oder JSON)', accept:{'application/zip':['.zip'],'application/json':['.json']}}]}); await importFile(await hd.getFile(), hd); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    $('#impFile').click();
  });
  $('#impFile').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if (f) await importFile(f, null); });
  $('#bProj').addEventListener('click', openProjects);
  $('#bSave').addEventListener('click', async () => { const ok = await save(); toast(ok ? 'Projekt "' + projTitle() + '" im Browser gespeichert.' : 'Speichern im Browser ist nicht möglich (Speicher gesperrt oder voll).'); });

  $('#bSg').addEventListener('click', openSettings);
  $('#dlgX').addEventListener('click', closeDlg);
  restore().then(renderAll);
  renderAll();
})();
</script>
</body>
</html>
